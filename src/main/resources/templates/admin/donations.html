<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Donation Log')}"></head>
<body>

    <div class="dashboard-container">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='donations')}"></div>

        <main class="main-content">
            <div th:replace="~{fragments/navbar :: navbar(pageTitle='Donation Log')}"></div>

            <!-- Alerts -->
            <div th:if="${param.recorded}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i> Donation recorded successfully! Stock updated.
            </div>
            <div th:if="${param.error}" class="alert alert-error" th:text="${param.error}">
                Error message
            </div>

            <!-- Record Donation Section -->
            <div class="glass-card" style="padding: 24px; margin-bottom: 30px;">
                <h2 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 20px;"><i class="fa-solid fa-pen-to-square" style="color: var(--primary-dark); margin-right: 8px;"></i> Record New Blood Donation</h2>
                <form th:action="@{/admin/donations/record}" method="post" style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;">
                    <!-- Donor Dropdown -->
                    <div class="form-group" style="margin-bottom: 0; min-width: 250px;">
                        <select name="donorId" class="form-input" required style="padding-top: 10px; padding-bottom: 10px; height: 50px;">
                            <option value="">Select Donor</option>
                            <option th:each="donor : ${donorsList}" th:value="${donor.donorId}" 
                                    th:text="${donor.user.name} + ' (' + ${donor.bloodGroup} + ')'"></option>
                        </select>
                    </div>

                    <!-- Units Input -->
                    <div class="form-group" style="margin-bottom: 0; min-width: 150px; position: relative;">
                        <input type="number" name="units" class="form-input" placeholder=" " min="1" max="5" required style="height: 50px;">
                        <label class="form-label">Units Donated</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="height: 50px; padding: 0 30px;"><i class="fa-solid fa-square-plus"></i> Record Donation</button>
                </form>
            </div>

            <!-- Donation History -->
            <div class="glass-card table-card" style="flex: 1;">
                <div class="card-header">
                    <h2>Donation Records</h2>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Donor Name</th>
                                <th>Blood Group</th>
                                <th>Units</th>
                                <th>Donation Date</th>
                                <th>Certificate Code</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="don : ${donationPage.content}">
                                <td th:text="${don.donor.user.name}">Donor Name</td>
                                <td th:text="${don.bloodGroup}" style="font-weight: 600; color: var(--primary-dark);">A+</td>
                                <td th:text="${don.unitsDonated}">1</td>
                                <td th:text="${don.donationDate != null ? #temporals.format(don.donationDate, 'yyyy-MM-dd') : 'N/A'}">Date</td>
                                <td th:text="${don.certificateCode}" style="font-family: monospace; font-weight: 600;">CERT-CODE</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(donationPage.content)}">
                                <td colspan="5" style="text-align: center; padding: 30px; color: var(--text-light);">
                                    <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; display: block; margin-bottom: 10px; color: var(--primary-light);"></i>
                                    No donation records found.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" th:if="${donationPage.totalPages > 1}" style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
                    <a th:if="${currentPage > 0}" th:href="@{/admin/donations(query=${query}, page=${currentPage - 1})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">Previous</a>
                    
                    <span th:each="i : ${#numbers.sequence(0, donationPage.totalPages - 1)}">
                        <a th:href="@{/admin/donations(query=${query}, page=${i})}" class="btn" 
                           th:classappend="${i == currentPage ? 'btn-primary' : 'btn-secondary'}" 
                           th:text="${i + 1}" style="padding: 6px 12px; font-size: 0.85rem;">1</a>
                    </span>
                    
                    <a th:if="${currentPage < donationPage.totalPages - 1}" th:href="@{/admin/donations(query=${query}, page=${currentPage + 1})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">Next</a>
                </div>
            </div>

            <!-- Footer -->
            <footer th:replace="~{fragments/common :: footer}"></footer>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
