<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Blood Requests')}"></head>
<body>

    <div class="dashboard-container">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='requests')}"></div>

        <main class="main-content">
            <div th:replace="~{fragments/navbar :: navbar(pageTitle='Blood Requests')}"></div>

            <!-- Notifications / Alerts -->
            <div th:if="${param.approved}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i> Request approved and stock deducted!
            </div>
            <div th:if="${param.rejected}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i> Request rejected.
            </div>
            <div th:if="${param.error}" class="alert alert-error" th:text="${param.error}">
                An error occurred!
            </div>

            <!-- Search and filters -->
            <div class="glass-card" style="padding: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;">
                <form th:action="@{/admin/requests}" method="get" style="display: flex; gap: 10px; flex: 1; max-width: 600px; align-items: center;">
                    <!-- Query -->
                    <div class="form-group" style="margin-bottom: 0; flex: 1; position: relative;">
                        <input type="text" name="query" th:value="${query}" class="form-input" placeholder="Search by patient, blood group...">
                    </div>
                    
                    <!-- Status Filter -->
                    <div class="form-group" style="margin-bottom: 0; width: 180px;">
                        <select name="status" class="form-input" style="padding-top: 10px; padding-bottom: 10px; height: 50px;">
                            <option value="">All Statuses</option>
                            <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                            <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                            <option value="REJECTED" th:selected="${status == 'REJECTED'}">Rejected</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" style="height: 50px;">Apply</button>
                </form>
            </div>

            <!-- Requests Table -->
            <div class="glass-card table-card" style="flex: 1;">
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Patient Name</th>
                                <th>Blood Group</th>
                                <th>Units</th>
                                <th>Required Date</th>
                                <th>Justification</th>
                                <th>Status</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${requestPage.content}">
                                <td th:text="${req.patient.user.name}">Patient Name</td>
                                <td th:text="${req.bloodGroup}" style="font-weight: 600; color: var(--primary-dark);">O+</td>
                                <td th:text="${req.unitsRequested}">2</td>
                                <td th:text="${#temporals.format(req.requiredDate, 'yyyy-MM-dd')}">Date</td>
                                <td th:text="${req.justification}">Emergency</td>
                                <td>
                                    <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(req.status)}" th:text="${req.status}">PENDING</span>
                                </td>
                                <td style="text-align: right;">
                                    <div th:if="${req.status == 'PENDING'}" style="display: inline-flex; gap: 8px;">
                                        <!-- Approve form -->
                                        <form th:action="@{/admin/requests/approve/{id}(id=${req.requestId})}" method="post">
                                            <button type="submit" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem; background: var(--success);"><i class="fa-solid fa-check"></i> Approve</button>
                                        </form>
                                        <!-- Reject form -->
                                        <form th:action="@{/admin/requests/reject/{id}(id=${req.requestId})}" method="post">
                                            <button type="submit" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; color: var(--danger); border-color: var(--danger);"><i class="fa-solid fa-xmark"></i> Reject</button>
                                        </form>
                                    </div>
                                    <div th:if="${req.status != 'PENDING'}">
                                        <span style="font-size: 0.85rem; color: var(--text-light); font-style: italic;">Processed</span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(requestPage.content)}">
                                <td colspan="7" style="text-align: center; padding: 30px; color: var(--text-light);">
                                    <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; display: block; margin-bottom: 10px; color: var(--primary-light);"></i>
                                    No blood requests found.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" th:if="${requestPage.totalPages > 1}" style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
                    <a th:if="${currentPage > 0}" th:href="@{/admin/requests(query=${query}, status=${status}, page=${currentPage - 1})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">Previous</a>
                    
                    <span th:each="i : ${#numbers.sequence(0, requestPage.totalPages - 1)}">
                        <a th:href="@{/admin/requests(query=${query}, status=${status}, page=${i})}" class="btn" 
                           th:classappend="${i == currentPage ? 'btn-primary' : 'btn-secondary'}" 
                           th:text="${i + 1}" style="padding: 6px 12px; font-size: 0.85rem;">1</a>
                    </span>
                    
                    <a th:if="${currentPage < requestPage.totalPages - 1}" th:href="@{/admin/requests(query=${query}, status=${status}, page=${currentPage + 1})}" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">Next</a>
                </div>
            </div>

            <!-- Footer -->
            <footer th:replace="~{fragments/common :: footer}"></footer>
        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
