<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - PulseLink'">PulseLink</title>
    
    <!-- CSS style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Theme Toggle Helper -->
    <script>
        // Check local storage or preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<div th:fragment="theme-toggle" class="theme-toggle-container" style="position: absolute; right: 24px; top: 24px;">
    <button onclick="toggleTheme()" class="btn btn-secondary" style="padding: 8px 14px; border-radius: 50%;">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>
    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            updateThemeIcon(target);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            updateThemeIcon(document.documentElement.getAttribute('data-theme'));
        });
    </script>
</div>

<footer th:fragment="footer">
    <p>&copy; 2026 PulseLink – Smart Blood Bank Management System. Connecting Donors. Saving Lives. All Rights Reserved.</p>
</footer>
</html>
