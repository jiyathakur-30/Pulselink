<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Reset Password')}"></head>
<body style="background: linear-gradient(135deg, #FFF7FB 0%, #FCE7F3 100%);">

    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="logo" style="justify-content: center; margin-bottom: 15px;">
                    <i class="fa-solid fa-droplet"></i>
                    <span>PulseLink</span>
                </div>
                <h2>Create New Password</h2>
                <p>Enter your email and your new password</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">
                Error message
            </div>

            <form th:action="@{/reset-password}" method="post">
                <!-- Email -->
                <div class="form-group">
                    <input type="email" id="email" name="email" class="form-input" placeholder=" " required autocomplete="email">
                    <label for="email" class="form-label">Email Address</label>
                </div>

                <!-- Password -->
                <div class="form-group password-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder=" " required autocomplete="new-password">
                    <label for="password" class="form-label">New Password</label>
                    <i class="fa-solid fa-eye password-toggle"></i>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Reset Password</button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-light);">
                Back to <a th:href="@{/login}" style="color: var(--primary-dark); font-weight: 600;">Login</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
